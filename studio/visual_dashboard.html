<!-- Visual Workflow Dashboard v1 -->
<section id="wfv" aria-label="Workflow live dashboard">
<style>
#wfv{--bg:#101827;--card:#182438;--line:#304159;--text:#eaf0fa;--muted:#a7b6cb;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif;padding:24px;border:1px solid var(--line);border-radius:16px;margin:18px;box-sizing:border-box}#wfv *{box-sizing:border-box}#wfv h2,#wfv h3,#wfv p{margin:0 0 10px}#wfv h2{font-size:25px}#wfv h3{font-size:16px}#wfv .muted{color:var(--muted)}#wfv .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#wfv .spread{justify-content:space-between}#wfv .grid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.5fr) 260px;gap:16px;margin-top:16px}#wfv .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}#wfv button,#wfv select{font:inherit;color:var(--text);background:#24364f;border:1px solid #50647f;border-radius:8px;padding:7px 11px;cursor:pointer}#wfv button:hover{background:#314a6c}#wfv button:focus-visible,#wfv select:focus-visible{outline:3px solid #75c7ff;outline-offset:2px}#wfv button:disabled{opacity:.5;cursor:wait}#wfv .badge{display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;letter-spacing:.03em}#wfv .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}#wfv .stat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#152134}#wfv .stat strong{display:block;font-size:25px}#wfv .joblist{max-height:680px;overflow:auto}#wfv .job{display:block;width:100%;text-align:left;margin-bottom:9px;padding:12px;border-left:4px solid var(--state-color,#8394ac);background:#142035}#wfv .job.selected{outline:2px solid #7dbbff;background:#203654}#wfv .job .id{font-family:monospace;font-size:11px;overflow-wrap:anywhere;margin-bottom:7px}#wfv .job .brief{display:block;color:#c6d2e2;font-size:12px;margin-top:7px}#wfv .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}#wfv .step{border:1px solid #3c4d65;border-radius:8px;padding:8px;font-size:11px;color:#adbad0}#wfv .step.current{border:2px solid #72b6ff;color:white;background:#25476c}#wfv .step.past{color:#94d9c0;background:#173a35}#wfv .metrics{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#wfv .metric{background:#101a2a;border:1px solid var(--line);padding:8px;border-radius:8px;font-size:12px}#wfv .notice{padding:10px;border-radius:8px;background:#142c45;border:1px solid #447097;margin:10px 0;overflow-wrap:anywhere}#wfv .warning{background:#3a2c18;border-color:#94713f;color:#ffe2a8}#wfv .error{background:#3d202b;border-color:#b36578;color:#ffd1dc}#wfv .success{background:#14392f;border-color:#4d967e;color:#b8f6db}#wfv .legenditem{border-bottom:1px solid var(--line);padding:9px 0}#wfv .legenditem p{font-size:12px;margin:6px 0 0;color:var(--muted)}#wfv pre{background:#0b1320;padding:12px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;font:11px/1.5 monospace}#wfv details{margin:10px 0}#wfv summary{cursor:pointer;color:#a8d4ff}#wfv img{max-width:100%;max-height:420px;display:block;border-radius:9px;margin:10px auto;background:#263446}#wfv .previewbox{text-align:center}#wfv .legendtitle{margin-top:10px}#wfv .hint{font-size:12px}#wfv .connection{font-size:12px;padding:5px 10px;border-radius:8px;background:#24364f}#wfv .stateunknown{color:#c6d2e2}@media(max-width:1150px){#wfv .grid{grid-template-columns:minmax(230px,1fr) minmax(300px,1.6fr)}#wfv .legend{grid-column:1/-1}#wfv .legendbody{display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}}@media(max-width:720px){#wfv{margin:8px;padding:14px}#wfv .grid{grid-template-columns:1fr}#wfv .stats{grid-template-columns:repeat(2,1fr)}#wfv .legendbody{display:block}}
</style>
<div class="row spread"><div><h2>AI Modeling - Live Dashboard</h2><p class="muted">Plan -> build -> check -> review. Status colors describe progress, not printability.</p></div><span class="connection" id="wfv-connection" role="status">Connecting...</span></div>
<div class="stats" id="wfv-stats"></div>
<div class="row spread"><div class="row"><label for="wfv-filter">Show</label><select id="wfv-filter"><option value="all">All current jobs</option><option value="active">Queued / active</option><option value="success">Succeeded</option><option value="attention">Failed / interrupted</option></select><button type="button" id="wfv-refresh">Refresh</button></div><span class="muted hint">Updates every 3 seconds. New-job form and existing controls remain below.</span></div>
<div class="grid"><section class="box"><h3>Jobs</h3><div id="wfv-jobs" class="joblist"></div></section><section class="box" id="wfv-detail"><p>Select a job to inspect its progress.</p></section><aside class="box legend"><h3>Available states</h3><div id="wfv-legend" class="legendbody"></div></aside></div>
<div id="wfv-message" role="status" class="hint muted" style="margin-top:12px"></div>
</section>
<script>
(() => {
 if(window.__wfvLoaded) return; window.__wfvLoaded=true;
 const key=__VISUAL_TOKEN_JSON__;
 const states={
 QUEUED:{label:'Queued',color:'#a8b5ca',description:'Accepted; waiting for the single job worker.'},
 DESCRIBING_IMAGE:{label:'Describing image',color:'#59d5ed',description:'Vision stage: prepares the image, loads the model if needed, and waits for its description.'},
 PLANNING_MODEL:{label:'Planning model',color:'#ba9cff',description:'Coding model writes the structured geometry and dimension plan.'},
 GENERATING_SCRIPT:{label:'Generating script',color:'#73b8ff',description:'Coding model writes the first Blender Python script.'},
 RUNNING_BLENDER:{label:'Running Blender',color:'#62dfcc',description:'Builds geometry, validates, exports, and renders previews. Internal phases may not be live.'},
 REVIEWING_PREVIEW:{label:'Reviewing preview',color:'#ec9cf5',description:'Vision model critiques rendered views against the plan and request.'},
 REPAIRING_SCRIPT:{label:'Repairing script',color:'#ffd176',description:'Coding model revises a failed attempt using actual errors or review feedback.'},
 SUCCEEDED:{label:'Succeeded',color:'#78e4a3',description:'Configured checks passed and final files were saved. Human and slicer inspection are still required.'},
 FAILED:{label:'Failed',color:'#ff8996',description:'Stopped on an error, quality rejection at the attempt limit, or configuration/service failure.'},
 INTERRUPTED:{label:'Interrupted',color:'#c4ad95',description:'Controller restarted during an unfinished job. Submit a new job; it is not automatically resumed.'}
 };
 const terminal=new Set(['SUCCEEDED','FAILED','INTERRUPTED']);
 const sequence=['QUEUED','DESCRIBING_IMAGE','PLANNING_MODEL','GENERATING_SCRIPT','RUNNING_BLENDER','REVIEWING_PREVIEW','SUCCEEDED'];
 const $=id=>document.getElementById(id);
 const node=(tag,text,cls)=>{const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;};
 function badge(state){const s=states[state]||{label:state||'Unknown',color:'#c6d2e2'};const el=node('span',s.label,'badge');el.style.color=s.color;return el;}
 let jobs=[],selected=null,polling=false,renderSignature='',previewUrl=null,previewGeneration=0;
 const msg=t=>$('wfv-message').textContent=t;
 async function request(route,payload){const options={headers:{'X-Workflow-Key':key},cache:'no-store'};if(payload){options.method='POST';options.headers['Content-Type']='application/json';options.body=JSON.stringify(payload);}const r=await fetch(route,options);const data=await r.json();if(!r.ok)throw new Error(data.error||('HTTP '+r.status));return data;}
 function revokePreview(){previewGeneration++;if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null;}}
 async function artifact(id,name,preview=false){const generation=previewGeneration;const r=await fetch('/artifact/'+encodeURIComponent(id)+'/'+encodeURIComponent(name),{headers:{'X-Workflow-Key':key},cache:'no-store'});if(!r.ok){let detail='Output is not available';try{detail=(await r.json()).error||detail;}catch(e){}throw new Error(detail);}const blob=await r.blob();if(preview){if(generation!==previewGeneration||selected!==id)return; if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(blob);const img=$('wfv-preview-image');if(img){img.src=previewUrl;img.hidden=false;}}else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=id+'-'+name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}}
 function action(label,fn){const b=node('button',label);b.type='button';b.onclick=async()=>{b.disabled=true;try{await fn();}catch(e){msg(e.message);}finally{b.disabled=false;}};return b;}
 function details(title,value){const d=node('details');d.append(node('summary',title),node('pre',typeof value==='string'?value:JSON.stringify(value,null,2)));return d;}
 function drawStats(){const counts=[['Current jobs',jobs.length],['Queued / active',jobs.filter(j=>!terminal.has(j.state)).length],['Succeeded',jobs.filter(j=>j.state==='SUCCEEDED').length],['Needs attention',jobs.filter(j=>['FAILED','INTERRUPTED'].includes(j.state)).length]];const box=$('wfv-stats');box.replaceChildren();for(const [label,value]of counts){const el=node('div',undefined,'stat');el.append(node('strong',String(value)),node('span',label,'muted'));box.append(el);}}
 function visible(j){const f=$('wfv-filter').value;return f==='all'||(f==='active'&&!terminal.has(j.state))||(f==='success'&&j.state==='SUCCEEDED')||(f==='attention'&&['FAILED','INTERRUPTED'].includes(j.state));}
 function drawList(){const box=$('wfv-jobs');box.replaceChildren();const filtered=jobs.filter(visible);if(!filtered.length){box.append(node('p','No jobs match this filter.','muted'));return;}for(const job of filtered){const b=node('button',undefined,'job'+(selected===job.id?' selected':''));b.type='button';b.style.setProperty('--state-color',(states[job.state]||{}).color||'#8394ac');b.append(node('div',job.id,'id'),badge(job.state));if(job.attempt)b.append(node('span','  Attempt '+job.attempt,'hint'));b.append(node('span',(job.instructions||'No instructions recorded').slice(0,115),'brief'));b.onclick=()=>{selected=job.id;renderSignature='';drawList();drawDetail();};box.append(b);}}
 function drawDetail(){const job=jobs.find(j=>j.id===selected);const box=$('wfv-detail');const signature=JSON.stringify(job||null);if(signature===renderSignature)return;renderSignature=signature;revokePreview();box.replaceChildren();if(!job){box.append(node('p','Select a job to inspect its progress.','muted'));return;}
 const head=node('div',undefined,'row spread');head.append(node('h3','Selected job'),badge(job.state));box.append(head,node('p',job.id,'muted hint'));if(job.attempt)box.append(node('p','Attempt '+job.attempt+' (maximum is set in your workflow configuration).','hint'));
 const steps=node('div',undefined,'steps');let index=sequence.indexOf(job.state);if(job.state==='REPAIRING_SCRIPT')index=sequence.indexOf('GENERATING_SCRIPT');for(let i=0;i<sequence.length;i++){const s=sequence[i];const el=node('div',(i+1)+'. '+states[s].label,'step'+(i===index?' current':i<index?' past':''));steps.append(el);}box.append(steps,node('p','Stage order is a guide, not percent complete. Revisions may skip description; repairs loop back to coding.','muted hint'));
 const stateInfo=states[job.state];if(stateInfo)box.append(node('div',stateInfo.description,'notice'+(job.state==='FAILED'?' error':job.state==='SUCCEEDED'?' success':job.state==='REPAIRING_SCRIPT'?' warning':'')));
 const checks=job.checks||{};const metrics=node('div',undefined,'metrics');if(Array.isArray(checks.dimensions_mm)){metrics.append(node('div','X × Y × Z: '+checks.dimensions_mm.map(n=>Number(n).toFixed(1)).join(' × ')+' mm','metric'));}if(checks.mesh_objects!==undefined)metrics.append(node('div',checks.mesh_objects+' mesh object(s)','metric'));if(checks.phase)metrics.append(node('div','Reported phase: '+checks.phase,'metric'));if(metrics.childNodes.length)box.append(metrics);
 const review=checks.visual_review;if(review){box.append(node('div','AI visual review: '+(review.pass?'accepted':'rejected')+'. This is a heuristic, not certification.','notice'+(review.pass?' success':' warning')));if(review.observations)box.append(node('p',review.observations));if(Array.isArray(review.issues))for(const issue of review.issues)box.append(node('div',issue,'notice warning'));}
 if(checks.quality_geometry&&Array.isArray(checks.quality_geometry.issues))for(const issue of checks.quality_geometry.issues)box.append(node('div',issue,'notice warning'));
 if(Array.isArray(checks.warnings))for(const warning of checks.warnings)box.append(node('div',warning,'notice warning'));
 if(job.error){const lines=job.error.trim().split('\n').filter(Boolean);box.append(node('div',(lines[lines.length-1]||'Job failed.').slice(0,400),'notice error'),details('Expand full error / traceback',job.error));}
 box.append(details('Model request',job.instructions||''));
 if(job.state==='SUCCEEDED'){
  const controls=node('div',undefined,'row');for(const [label,file]of [['3MF','model.3mf'],['Blender file','model.blend'],['Checks','checks.json'],['Plan','quality_plan.json'],['AI review','visual_review.json']])controls.append(action('Save '+label,()=>artifact(job.id,file)));box.append(controls);
  const previews=node('div',undefined,'row');for(const [label,file]of [['Main preview','preview.png'],['Side view','preview_side.png'],['Top view','preview_top.png']])previews.append(action(label,()=>artifact(job.id,file,true)));box.append(previews);const img=node('img');img.id='wfv-preview-image';img.alt='Rendered model preview for selected job';img.hidden=true;box.append(img);artifact(job.id,'preview.png',true).catch(e=>msg(e.message));
  box.append(node('p','Older jobs may not have side/top previews, plans, or AI-review files. They were not rechecked by this visual update.','muted hint'));
 }
 if(terminal.has(job.state)){box.append(action('Archive this job',async()=>{if(!confirm('Archive '+job.id+'? Files will be moved, not deleted.'))return;await request('/archive',{id:job.id});selected=null;renderSignature='';await refresh();msg('Job archived. Restore controls remain in the Job archive section below.');}));}
 box.append(details('Full reported status',job));
 }
 async function refresh(){if(polling)return;polling=true;try{const data=await request('/jobs');if(!Array.isArray(data))throw new Error('Unexpected jobs response');jobs=data;if(!jobs.some(j=>j.id===selected)){selected=(jobs.find(j=>!terminal.has(j.state))||jobs[0]||{}).id||null;renderSignature='';}drawStats();drawList();drawDetail();const c=$('wfv-connection');c.textContent='Connected · '+new Date().toLocaleTimeString();c.style.color='#78e4a3';}catch(e){const c=$('wfv-connection');c.textContent='Disconnected / refresh failed';c.style.color='#ff8996';msg(e.message+' — check the workflow controller window.');}finally{polling=false;}}
 for(const [id,s]of Object.entries(states)){const row=node('div',undefined,'legenditem');row.append(badge(id),node('p',s.description));$('wfv-legend').append(row);}
 $('wfv-filter').onchange=drawList;$('wfv-refresh').onclick=refresh;
 window.addEventListener('beforeunload',revokePreview);refresh();setInterval(refresh,3000);
})();
</script>
